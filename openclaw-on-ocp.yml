---
# =============================================================================
# OpenClaw on OpenShift — Unified Ansible Playbook
# File: openclaw-on-ocp.yml
#
# Usage:
#   # Deploy (default)
#   ansible-playbook openclaw-on-ocp.yml \
#     -e ai_provider=anthropic \
#     -e ai_api_key=sk-ant-...
#
#   # Deploy with a messaging channel
#   ansible-playbook openclaw-on-ocp.yml \
#     -e ai_provider=anthropic \
#     -e ai_api_key=sk-ant-... \
#     -e '{"openclaw_channels":{"telegram":{"enabled":true,"bot_token":"7123:AAH..."}}}'
#
#   # Deploy with Vault-encrypted credentials
#   ansible-playbook openclaw-on-ocp.yml \
#     -e ai_provider=anthropic \
#     --ask-vault-pass
#
#   # Force rolling restart after image re-tag
#   ansible-playbook openclaw-on-ocp.yml \
#     -e ai_provider=anthropic -e ai_api_key=sk-ant-... \
#     -e openclaw_force_restart=true
#
#   # Delete — preserve PVCs (config and workspace data survives)
#   ansible-playbook openclaw-on-ocp.yml -e state=absent
#
#   # Delete — wipe everything including PVCs (PERMANENT DATA LOSS)
#   ansible-playbook openclaw-on-ocp.yml -e state=absent -e delete_pvcs=true
#
# Prerequisites:
#   ansible-galaxy collection install kubernetes.core
#   pip install kubernetes
#   oc login ... (or KUBECONFIG set)
# =============================================================================

- name: OpenClaw on OpenShift
  hosts: localhost
  connection: local
  gather_facts: "{{ state == 'present' }}"   # ansible_date_time needed for force-restart

  vars_files:
    - vars/openclaw.yml

  vars:
    # ── State ─────────────────────────────────────────────────────────────────
    state: present       # present = deploy/update  |  absent = delete

    # ── Delete options (only relevant when state=absent) ──────────────────────
    # Default preserves PVCs so a re-deploy picks up where it left off.
    # Pass -e delete_pvcs=true to also wipe config, memory, and workspace data.
    delete_pvcs: false

    # ── Deploy internals ──────────────────────────────────────────────────────
    _api_key_env_var: "{{ _provider_env_map[ai_provider] | default('') }}"

    _generated_token: "{{ lookup('password', '/dev/null chars=hexdigits length=64') }}"
    _gateway_token: "{{ openclaw_gateway_token if openclaw_gateway_token | length > 0 else _generated_token }}"

    _telegram_enabled:  "{{ openclaw_channels.telegram.enabled          | default(false) | bool }}"
    _discord_enabled:   "{{ openclaw_channels.discord.enabled           | default(false) | bool }}"
    _slack_enabled:     "{{ openclaw_channels.slack.enabled             | default(false) | bool }}"
    _whatsapp_enabled:  "{{ openclaw_channels.whatsapp_business.enabled | default(false) | bool }}"
    _matrix_enabled:    "{{ openclaw_channels.matrix.enabled            | default(false) | bool }}"
    _teams_enabled:     "{{ openclaw_channels.teams.enabled             | default(false) | bool }}"

    # Resolve the model: use ai_model if set, else look up from the provider map
    _resolved_model: "{{ ai_model if ai_model | length > 0 else _provider_model_map[ai_provider] | default('') }}"

    # Resolve the image: use openclaw_image if explicitly set, else pick from
    # _variant_image_map (ubi10 -> :latest, hummingbird -> :hummingbird-latest).
    _resolved_image: >-
      {{ openclaw_image if openclaw_image | length > 0
         else _variant_image_map[openclaw_variant] | default(_variant_image_map['ubi10']) }}


    # ── "Log in with OpenShift" (openclaw_auth: openshift) ────────────────────
    _sso: "{{ openclaw_auth | default('token') == 'openshift' }}"
    # Default: anyone who can view Services in this namespace may log in.
    _oauth_sar: >-
      {{ openclaw_oauth_sar if openclaw_oauth_sar | default('') | length > 0
         else ({'namespace': openclaw_namespace, 'resource': 'services', 'verb': 'get'} | to_json) }}

    _any_channel_enabled: >-
      {{ (_telegram_enabled or _discord_enabled or _slack_enabled
          or _whatsapp_enabled or _matrix_enabled or _teams_enabled) | bool }}

  # ============================================================================
  # PRE-TASKS — run for both deploy and delete
  # ============================================================================
  pre_tasks:

    - name: Resolve current OpenShift namespace from active oc context
      ansible.builtin.command:
        cmd: oc project -q
      register: _oc_project
      changed_when: false
      failed_when: _oc_project.rc != 0

    - name: Set openclaw_namespace from active oc project
      ansible.builtin.set_fact:
        openclaw_namespace: "{{ _oc_project.stdout | trim }}"
      when: openclaw_namespace == '' or openclaw_namespace == 'openclaw-sandbox'

    - name: Show operation summary
      ansible.builtin.debug:
        msg:
          - "Operation  : {{ 'DEPLOY' if state == 'present' else 'DELETE' }}"
          - "Namespace  : {{ openclaw_namespace }}"
          - "{% if state == 'present' %}Variant    : {{ openclaw_variant }} → {{ _resolved_image }}{% else %}Delete PVCs: {{ delete_pvcs }}{% endif %}"

    # ── Deploy-only validation ─────────────────────────────────────────────────
    - name: Validate ai_provider value
      ansible.builtin.assert:
        that: ai_provider in _provider_env_map
        fail_msg: >
          Unknown ai_provider '{{ ai_provider }}'.
          Supported values: {{ _provider_env_map.keys() | list | join(', ') }}
      when: state == 'present'

    - name: Validate ai_api_key is not empty
      ansible.builtin.assert:
        that:
          - ai_api_key is defined
          - ai_api_key | length > 0
        fail_msg: "ai_api_key must be set (pass via -e or Ansible Vault)"
      when: state == 'present'

    - name: Validate openclaw_auth value
      ansible.builtin.assert:
        that: openclaw_auth | default('token') in ['token', 'openshift']
        fail_msg: "openclaw_auth must be 'token' or 'openshift' (got '{{ openclaw_auth }}')"
      when: state == 'present'

    - name: Reject WhatsApp webhooks with Log in with OpenShift
      ansible.builtin.fail:
        msg: >-
          WhatsApp Business needs an unauthenticated inbound webhook, which
          'Log in with OpenShift' would block. Use openclaw_auth=token, or
          disable the WhatsApp channel.
      when: state == 'present' and _sso | bool and _whatsapp_enabled | bool

    - name: Validate Telegram bot_token
      ansible.builtin.assert:
        that: openclaw_channels.telegram.bot_token | default('') | length > 0
        fail_msg: "openclaw_channels.telegram.bot_token must be set when telegram is enabled"
      when: state == 'present' and _telegram_enabled | bool

    - name: Validate Discord bot_token
      ansible.builtin.assert:
        that: openclaw_channels.discord.bot_token | default('') | length > 0
        fail_msg: "openclaw_channels.discord.bot_token must be set when discord is enabled"
      when: state == 'present' and _discord_enabled | bool

    - name: Validate Slack tokens
      ansible.builtin.assert:
        that:
          - openclaw_channels.slack.bot_token     | default('') | length > 0
          - openclaw_channels.slack.app_token     | default('') | length > 0
          - openclaw_channels.slack.signing_secret | default('') | length > 0
        fail_msg: "All three Slack tokens (bot_token, app_token, signing_secret) must be set"
      when: state == 'present' and _slack_enabled | bool

    - name: Validate WhatsApp Business tokens
      ansible.builtin.assert:
        that:
          - openclaw_channels.whatsapp_business.access_token     | default('') | length > 0
          - openclaw_channels.whatsapp_business.phone_number_id  | default('') | length > 0
          - openclaw_channels.whatsapp_business.verify_token     | default('') | length > 0
        fail_msg: "access_token, phone_number_id, and verify_token are required for WhatsApp Business"
      when: state == 'present' and _whatsapp_enabled | bool

    # ── Delete-only guard ──────────────────────────────────────────────────────
    - name: Validate MCP server definitions
      ansible.builtin.assert:
        that:
          - item.value.url | default('') | length > 0
          - (item.value.transport | default('streamable-http')) in ['streamable-http', 'sse']
          - item.key is match('^[a-z][a-z0-9_-]*$')
        fail_msg: >-
          openclaw_mcp_servers.{{ item.key }} needs a url, a transport of
          streamable-http or sse, and a lowercase name (letters, digits, - or _)
      loop: "{{ openclaw_mcp_servers | default({}) | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
      when: state == 'present'

    - name: Validate automation definitions
      ansible.builtin.assert:
        that:
          - item.value.schedule | default('') | length > 0
          - item.value.prompt | default('') | length > 0
          - item.key is match('^[a-z][a-z0-9_-]*$')
          - not ((item.value.delivery.webhook | default('') | length > 0)
                 and (item.value.delivery.channel | default('') | length > 0))
        fail_msg: >-
          openclaw_automations.{{ item.key }} needs a schedule and a prompt, a
          lowercase name, and either delivery.webhook or delivery.channel/to (not both)
      loop: "{{ openclaw_automations | default({}) | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
      when: state == 'present'

    - name: Confirm PVC deletion
      ansible.builtin.pause:
        prompt: >
          ⚠️  WARNING: delete_pvcs=true will permanently destroy all OpenClaw
          config, memory, conversation history, and workspace files in
          namespace '{{ openclaw_namespace }}'. This cannot be undone.
          Press ENTER to continue or Ctrl-C then A to abort.
      when: state == 'absent' and delete_pvcs | bool

  # ============================================================================
  # TASKS
  # ============================================================================
  tasks:

    # ==========================================================================
    # DELETE BLOCK  (state=absent)
    # ==========================================================================
    - name: Scale Deployment to 0 before deletion (releases PVC bindings cleanly)
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: openclaw
            namespace: "{{ openclaw_namespace }}"
          spec:
            replicas: 0
      ignore_errors: true
      when: state == 'absent'

    - name: Wait for pod to terminate
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Pod
        namespace: "{{ openclaw_namespace }}"
        label_selectors:
          - app.kubernetes.io/name=openclaw
      register: _pods
      until: _pods.resources | length == 0
      retries: 18
      delay: 5
      ignore_errors: true
      when: state == 'absent'

    - name: Delete Deployment
      kubernetes.core.k8s:
        state: absent
        api_version: apps/v1
        kind: Deployment
        name: openclaw
        namespace: "{{ openclaw_namespace }}"
      when: state == 'absent'

    - name: Delete Route
      kubernetes.core.k8s:
        state: absent
        api_version: route.openshift.io/v1
        kind: Route
        name: openclaw
        namespace: "{{ openclaw_namespace }}"
      when: state == 'absent'

    - name: Delete Service
      kubernetes.core.k8s:
        state: absent
        api_version: v1
        kind: Service
        name: openclaw
        namespace: "{{ openclaw_namespace }}"
      when: state == 'absent'

    - name: Delete Log in with OpenShift resources
      kubernetes.core.k8s:
        state: absent
        api_version: "{{ item.api }}"
        kind: "{{ item.kind }}"
        name: "{{ item.name }}"
        namespace: "{{ openclaw_namespace }}"
      loop:
        - { api: networking.k8s.io/v1, kind: NetworkPolicy,  name: openclaw-sso-ingress }
        - { api: v1,                   kind: Secret,         name: openclaw-proxy }
        - { api: v1,                   kind: ServiceAccount, name: openclaw-proxy }
      failed_when: false
      when: state == 'absent'

    - name: Delete credentials Secret
      kubernetes.core.k8s:
        state: absent
        api_version: v1
        kind: Secret
        name: openclaw-credentials
        namespace: "{{ openclaw_namespace }}"
      when: state == 'absent'

    - name: Delete channel config ConfigMap
      kubernetes.core.k8s:
        state: absent
        api_version: v1
        kind: ConfigMap
        name: openclaw-channel-config
        namespace: "{{ openclaw_namespace }}"
      when: state == 'absent'

    - name: Delete custom skills ConfigMap
      kubernetes.core.k8s:
        state: absent
        api_version: v1
        kind: ConfigMap
        name: openclaw-custom-skills
        namespace: "{{ openclaw_namespace }}"
      when: state == 'absent'

    - name: Delete config PVC (DATA LOSS)
      kubernetes.core.k8s:
        state: absent
        api_version: v1
        kind: PersistentVolumeClaim
        name: openclaw-config
        namespace: "{{ openclaw_namespace }}"
      when: state == 'absent' and delete_pvcs | bool

    - name: Delete workspace PVC (DATA LOSS)
      kubernetes.core.k8s:
        state: absent
        api_version: v1
        kind: PersistentVolumeClaim
        name: openclaw-workspace
        namespace: "{{ openclaw_namespace }}"
      when: state == 'absent' and delete_pvcs | bool

    - name: Print deletion summary
      ansible.builtin.debug:
        msg:
          - "=== Deletion complete ==="
          - "Namespace  : {{ openclaw_namespace }}"
          - "Deployment : deleted"
          - "Route      : deleted"
          - "Service    : deleted"
          - "Secret     : deleted"
          - "ConfigMaps : deleted"
          - "PVCs       : {{ 'deleted — all data gone' if delete_pvcs | bool else 'PRESERVED — data intact' }}"
          - ""
          - "{% if not delete_pvcs | bool %}To redeploy and resume where you left off:{% else %}To redeploy from scratch:{% endif %}"
          - "  ansible-playbook openclaw-on-ocp.yml -e ai_provider=anthropic -e ai_api_key=..."
      when: state == 'absent'

    # ==========================================================================
    # DEPLOY BLOCK  (state=present)
    # ==========================================================================

    # ── Secrets ────────────────────────────────────────────────────────────────
    - name: Build channel secret data dict
      ansible.builtin.set_fact:
        _channel_secret_data: >-
          {{
            ({"TELEGRAM_BOT_TOKEN": openclaw_channels.telegram.bot_token}
             if _telegram_enabled | bool else {})
            | combine(
              {"DISCORD_BOT_TOKEN": openclaw_channels.discord.bot_token}
              if _discord_enabled | bool else {}
            )
            | combine(
              {"SLACK_BOT_TOKEN":       openclaw_channels.slack.bot_token,
               "SLACK_APP_TOKEN":       openclaw_channels.slack.app_token,
               "SLACK_SIGNING_SECRET":  openclaw_channels.slack.signing_secret}
              if _slack_enabled | bool else {}
            )
            | combine(
              {"WA_ACCESS_TOKEN":    openclaw_channels.whatsapp_business.access_token,
               "WA_PHONE_NUMBER_ID": openclaw_channels.whatsapp_business.phone_number_id,
               "WA_VERIFY_TOKEN":    openclaw_channels.whatsapp_business.verify_token}
              if _whatsapp_enabled | bool else {}
            )
            | combine(
              {"MATRIX_ACCESS_TOKEN": openclaw_channels.matrix.access_token}
              if _matrix_enabled | bool else {}
            )
            | combine(
              {"TEAMS_APP_ID":        openclaw_channels.teams.app_id,
               "TEAMS_APP_PASSWORD":  openclaw_channels.teams.app_password}
              if _teams_enabled | bool else {}
            )
          }}
      when: state == 'present'

    # ── "Log in with OpenShift" prep ───────────────────────────────────────────
    # ── MCP servers ────────────────────────────────────────────────────────────
    # Two outputs from openclaw_mcp_servers:
    #   _mcp_secret_data — {OPENCLAW_MCP_KEY_<NAME>: api_key} for servers that
    #                      have one; merged into the credentials Secret so the
    #                      key reaches the pod as an env var only.
    #   _mcp_spec_json   — everything else, as JSON in OPENCLAW_MCP_SERVERS; the
    #                      entrypoint writes it to mcp.servers in openclaw.json
    #                      and references the key as ${OPENCLAW_MCP_KEY_<NAME>}.
    - name: Build MCP server secret data and spec
      ansible.builtin.set_fact:
        _mcp_secret_data: >-
          {{ _mcp_secret_data | default({}) | combine(
               {('OPENCLAW_MCP_KEY_' ~ (item.key | upper | regex_replace('[^A-Z0-9]', '_'))): item.value.api_key}
               if (item.value.api_key | default('') | length > 0) else {}) }}
        _mcp_spec: >-
          {{ _mcp_spec | default({}) | combine({item.key: {
               'url': item.value.url,
               'transport': item.value.transport | default('streamable-http'),
               'headerName': item.value.header_name | default(''),
               'keyEnv': ('OPENCLAW_MCP_KEY_' ~ (item.key | upper | regex_replace('[^A-Z0-9]', '_')))
                         if (item.value.api_key | default('') | length > 0) else '',
               'toolInclude': item.value.tool_include | default([]),
               'requestTimeoutMs': item.value.request_timeout_ms | default(20000),
               'connectionTimeoutMs': item.value.connection_timeout_ms | default(5000)
             }}) }}
      loop: "{{ openclaw_mcp_servers | default({}) | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
      when: state == 'present'

    - name: Identify the user running the playbook (default OpenClaw admin)
      ansible.builtin.command: oc whoami
      register: _oc_whoami
      changed_when: false
      when: state == 'present' and _sso | bool

    - name: Set admin user list
      ansible.builtin.set_fact:
        _admin_users: >-
          {{ openclaw_admin_users if openclaw_admin_users | default([]) | length > 0
             else [_oc_whoami.stdout | trim] }}
      when: state == 'present' and _sso | bool

    - name: Look up existing oauth-proxy Secret (keeps sessions across re-runs)
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Secret
        name: openclaw-proxy
        namespace: "{{ openclaw_namespace }}"
      register: _proxy_secret_info
      when: state == 'present' and _sso | bool

    - name: Resolve cookie secret and in-pod CLI password
      ansible.builtin.set_fact:
        _cookie_secret: >-
          {{ (_proxy_secret_info.resources[0].data.session_secret | b64decode)
             if (_proxy_secret_info.resources | length > 0)
             else lookup('password', '/dev/null chars=ascii_letters,digits length=32') }}
        _gateway_password: >-
          {{ (_proxy_secret_info.resources[0].data.gateway_password | b64decode)
             if (_proxy_secret_info.resources | length > 0
                 and 'gateway_password' in _proxy_secret_info.resources[0].data)
             else lookup('password', '/dev/null chars=hexdigits length=64') }}
      when: state == 'present' and _sso | bool

    - name: Look up the cluster's oauth-proxy ImageStream
      kubernetes.core.k8s_info:
        api_version: image.openshift.io/v1
        kind: ImageStream
        name: oauth-proxy
        namespace: openshift
      register: _oauth_is
      failed_when: false
      when: state == 'present' and _sso | bool and openclaw_oauth_proxy_image | default('') | length == 0

    # Prefer the oauth-proxy image that ships with the cluster (matches its
    # version, no extra pull secret); fall back to Red Hat's registry.
    - name: Resolve oauth-proxy image
      ansible.builtin.set_fact:
        _oauth_proxy_image: >-
          {{ openclaw_oauth_proxy_image if openclaw_oauth_proxy_image | default('') | length > 0
             else ((_oauth_is.resources[0].status.dockerImageRepository ~ ':v4.4')
                   if (_oauth_is.resources | default([]) | length > 0
                       and _oauth_is.resources[0].status.dockerImageRepository | default('') | length > 0)
                   else 'registry.redhat.io/openshift4/ose-oauth-proxy-rhel9:latest') }}
      when: state == 'present' and _sso | bool

    - name: Create/update oauth-proxy Secret
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: openclaw-proxy
            namespace: "{{ openclaw_namespace }}"
            labels:
              app.kubernetes.io/name: openclaw
              app.kubernetes.io/component: oauth-proxy
          type: Opaque
          stringData:
            session_secret: "{{ _cookie_secret }}"
            gateway_password: "{{ _gateway_password }}"
      when: state == 'present' and _sso | bool

    # The ServiceAccount *is* the OAuth client. The redirect-reference
    # annotation tells the cluster OAuth server which Route may receive the
    # login callback — no cluster-admin, no OAuthClient object needed.
    - name: Create/update oauth-proxy ServiceAccount (OAuth client)
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: ServiceAccount
          metadata:
            name: openclaw-proxy
            namespace: "{{ openclaw_namespace }}"
            labels:
              app.kubernetes.io/name: openclaw
              app.kubernetes.io/component: oauth-proxy
            annotations:
              serviceaccounts.openshift.io/oauth-redirectreference.primary: >-
                {"kind":"OAuthRedirectReference","apiVersion":"v1","reference":{"kind":"Route","name":"openclaw"}}
      when: state == 'present' and _sso | bool

    - name: Create/update credentials Secret
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: openclaw-credentials
            namespace: "{{ openclaw_namespace }}"
            labels:
              app.kubernetes.io/name: openclaw
              app.kubernetes.io/component: credentials
          type: Opaque
          stringData: >-
            {{
              ({"OPENCLAW_GATEWAY_PASSWORD": _gateway_password}
                if _sso | bool else {"OPENCLAW_GATEWAY_TOKEN": _gateway_token})
              | combine({_api_key_env_var: ai_api_key})
              | combine(_channel_secret_data)
              | combine(_mcp_secret_data | default({}))
              | combine(
                  {"OPENCLAW_OPENAI_API_KEY": openai_api_key}
                  if (openai_api_key | default("") | length > 0)
                  else {}
                )
            }}
      when: state == 'present'

    - name: Display generated gateway token (save this!)
      ansible.builtin.debug:
        msg: "OPENCLAW_GATEWAY_TOKEN = {{ _gateway_token }}"
      when: state == 'present' and openclaw_gateway_token | length == 0 and not (_sso | bool)

    # ── ConfigMaps ─────────────────────────────────────────────────────────────
    - name: Render channel config JSON from template
      ansible.builtin.set_fact:
        _channel_config_json: "{{ lookup('template', 'templates/channels-config.json.j2') }}"
      when: state == 'present' and _any_channel_enabled | bool

    - name: Create/update channel config ConfigMap
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: openclaw-channel-config
            namespace: "{{ openclaw_namespace }}"
            labels:
              app.kubernetes.io/name: openclaw
              app.kubernetes.io/component: channel-config
          data:
            channels-config.json: "{{ _channel_config_json }}"
      when: state == 'present' and _any_channel_enabled | bool

    - name: Remove channel ConfigMap when no channels enabled
      kubernetes.core.k8s:
        state: absent
        api_version: v1
        kind: ConfigMap
        name: openclaw-channel-config
        namespace: "{{ openclaw_namespace }}"
      when: state == 'present' and not (_any_channel_enabled | bool)

    - name: Create/update custom skills ConfigMap
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: openclaw-custom-skills
            namespace: "{{ openclaw_namespace }}"
            labels:
              app.kubernetes.io/name: openclaw
              app.kubernetes.io/component: custom-skills
          data: >-
            {{
              dict(openclaw_custom_skills
                | map(attribute='name')
                | zip(openclaw_custom_skills | map(attribute='skill_md')))
            }}
      when: state == 'present' and openclaw_custom_skills | default([]) | length > 0

    - name: Remove custom skills ConfigMap when no skills defined
      kubernetes.core.k8s:
        state: absent
        api_version: v1
        kind: ConfigMap
        name: openclaw-custom-skills
        namespace: "{{ openclaw_namespace }}"
      when: state == 'present' and openclaw_custom_skills | default([]) | length == 0

    # ── Persistent Volume Claims ───────────────────────────────────────────────
    - name: Create config PVC
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: PersistentVolumeClaim
          metadata:
            name: openclaw-config
            namespace: "{{ openclaw_namespace }}"
            labels:
              app.kubernetes.io/name: openclaw
              app.kubernetes.io/component: config
          spec:
            accessModes:
              - ReadWriteOnce
            storageClassName: "{{ openclaw_config_pvc_storage_class | default(omit, true) }}"
            resources:
              requests:
                storage: "{{ openclaw_config_pvc_size }}"
      when: state == 'present'

    - name: Create workspace PVC
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: PersistentVolumeClaim
          metadata:
            name: openclaw-workspace
            namespace: "{{ openclaw_namespace }}"
            labels:
              app.kubernetes.io/name: openclaw
              app.kubernetes.io/component: workspace
          spec:
            accessModes:
              - ReadWriteOnce
            storageClassName: "{{ openclaw_workspace_pvc_storage_class | default(omit, true) }}"
            resources:
              requests:
                storage: "{{ openclaw_workspace_pvc_size }}"
      when: state == 'present'

    # ── Service & Route (created before Deployment so hostname is known) ───────
    - name: Create Service
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Service
          metadata:
            name: openclaw
            namespace: "{{ openclaw_namespace }}"
            labels:
              app.kubernetes.io/name: openclaw
          spec:
            selector:
              app.kubernetes.io/name: openclaw
            ports: >-
              {{ [{'name': 'gateway', 'port': 18789, 'targetPort': 'gateway', 'protocol': 'TCP'}]
                 + ([{'name': 'proxy', 'port': 8080, 'targetPort': 'proxy', 'protocol': 'TCP'}]
                    if _sso | bool else []) }}
      when: state == 'present'

    - name: Create Route
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: route.openshift.io/v1
          kind: Route
          metadata:
            name: openclaw
            namespace: "{{ openclaw_namespace }}"
            labels:
              app.kubernetes.io/name: openclaw
            annotations:
              # Uncomment to restrict Control UI access to specific IPs/CIDRs:
              # haproxy.router.openshift.io/ip_whitelist: "203.0.113.10/32"
              haproxy.router.openshift.io/rate-limit-connections: "true"
              haproxy.router.openshift.io/rate-limit-connections.rate-http: "100"
              haproxy.router.openshift.io/rate-limit-connections.rate-tcp: "100"
          spec:
            to:
              kind: Service
              name: openclaw
            port:
              # Log in with OpenShift: traffic enters through the oauth-proxy sidecar
              targetPort: "{{ 'proxy' if _sso | bool else 'gateway' }}"
            tls:
              termination: edge
              insecureEdgeTerminationPolicy: Redirect
      when: state == 'present'

    - name: Wait for Route hostname to be assigned
      kubernetes.core.k8s_info:
        api_version: route.openshift.io/v1
        kind: Route
        name: openclaw
        namespace: "{{ openclaw_namespace }}"
      register: _route_info
      until: _route_info.resources[0].spec.host | default('') | length > 0
      retries: 12
      delay: 5
      when: state == 'present'

    - name: Set route hostname fact
      ansible.builtin.set_fact:
        _route_host: "{{ _route_info.resources[0].spec.host }}"
      when: state == 'present'

    # ── Container specs (gateway + optional oauth-proxy sidecar) ──────────────
    - name: Build gateway container spec
      ansible.builtin.set_fact:
        _gateway_container:
          name: openclaw-gateway
          image: "{{ _resolved_image }}"
          imagePullPolicy: Always
          ports:
            - name: gateway
              containerPort: 18789
              protocol: TCP
          envFrom:
            - secretRef:
                name: openclaw-credentials
          env:
            - name: OPENCLAW_CONFIG_DIR
              value: /opt/openclaw/.openclaw
            - name: OPENCLAW_WORKSPACE_DIR
              value: /opt/openclaw/workspace
            - name: OPENCLAW_DISABLE_BONJOUR
              value: "1"
            - name: NODE_ENV
              value: production
            - name: HOME
              value: /opt/openclaw
            - name: OPENCLAW_DEFAULT_MODEL
              value: "{{ _resolved_model }}"
            - name: OPENCLAW_PUBLIC_URL
              value: "https://{{ _route_host }}"
            - name: OPENCLAW_CHANNEL_CONFIG_PATH
              value: "{{ '/opt/openclaw/channel-config/channels-config.json' if _any_channel_enabled else '' }}"
            # Internal LLM (OpenAI-compatible) overrides — entrypoint
            # writes a custom provider to openclaw.json when both are set.
            - name: OPENCLAW_OPENAI_BASE_URL
              value: "{{ openai_base_url | default('') }}"
            - name: OPENCLAW_OPENAI_MODEL
              value: "{{ openai_model | default('') }}"
            # MCP servers (non-secret spec; keys arrive via the credentials
            # Secret as OPENCLAW_MCP_KEY_<NAME>) — see entrypoint.sh
            - name: OPENCLAW_MCP_SERVERS
              value: "{{ _mcp_spec | default({}) | to_json }}"
            # Authentication mode — see "Log in with OpenShift" in README
            - name: OPENCLAW_AUTH_MODE
              value: "{{ 'trusted-proxy' if _sso else 'token' }}"
            - name: OPENCLAW_ADMIN_USERS
              value: "{{ _admin_users | join(',') if _sso else '' }}"
            - name: OPENCLAW_TRUSTED_PROXY_ALLOW_USERS
              value: "{{ openclaw_allowed_users | default([]) | join(',') }}"
            - name: OPENCLAW_TRUSTED_PROXIES
              value: "{{ openclaw_trusted_proxies | default([]) | join(',') }}"
          resources: "{{ openclaw_resources }}"
          volumeMounts:
            - name: config
              mountPath: /opt/openclaw/.openclaw
            - name: workspace
              mountPath: /opt/openclaw/workspace
            - name: channel-config
              mountPath: /opt/openclaw/channel-config
              readOnly: true
          # OpenClaw 2.x can block the event loop for several
          # seconds during an agent turn. With the default 1s probe
          # timeout, kubelet declared the gateway dead ~2 min after
          # start and SIGKILLed it (exit 137, reason "Error").
          startupProbe:
            httpGet:
              path: /healthz
              port: gateway
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: gateway
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /healthz
              port: gateway
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
      when: state == 'present'

    - name: Build oauth-proxy sidecar spec ("Log in with OpenShift")
      ansible.builtin.set_fact:
        _sidecar_containers:
          - name: oauth-proxy
            image: "{{ _oauth_proxy_image }}"
            imagePullPolicy: IfNotPresent
            args:
              - --provider=openshift
              - --openshift-service-account=openclaw-proxy
              - --http-address=0.0.0.0:8080
              - --https-address=
              - --upstream=http://127.0.0.1:18789
              - --cookie-secret=$(OAUTH_COOKIE_SECRET)
              # No --skip-provider-button: with it, EVERY unauthenticated request
              # (favicon, prefetch, WebSocket reconnect) restarts the OAuth flow
              # and overwrites the CSRF cookie -> "403 csrf failed" on callback.
              # The sign-in page's button is the only thing that starts a login.
              - --email-domain=*
              # Identity goes to OpenClaw in X-Forwarded-User (always overwritten
              # by the proxy). Basic-auth passthrough is off so the gateway never
              # sees an Authorization header it might misread as a credential.
              - --pass-user-headers=true
              - --pass-basic-auth=false
              - --pass-access-token=false
              - "--openshift-sar={{ _oauth_sar }}"
            env:
              - name: OAUTH_COOKIE_SECRET
                valueFrom:
                  secretKeyRef:
                    name: openclaw-proxy
                    key: session_secret
            ports:
              - name: proxy
                containerPort: 8080
                protocol: TCP
            readinessProbe:
              httpGet:
                path: /oauth/healthz
                port: proxy
              periodSeconds: 10
            livenessProbe:
              httpGet:
                path: /oauth/healthz
                port: proxy
              periodSeconds: 30
              timeoutSeconds: 5
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                cpu: 200m
                memory: 128Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: [ALL]
      when: state == 'present' and _sso | bool

    # ── Deployment ─────────────────────────────────────────────────────────────
    - name: Deploy OpenClaw
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: openclaw
            namespace: "{{ openclaw_namespace }}"
            labels:
              app.kubernetes.io/name: openclaw
              app.kubernetes.io/component: gateway
              app.kubernetes.io/managed-by: ansible
              app.openshift.io/runtime: nodejs
            annotations:
              deployment.kubernetes.io/force-restart: "{{ ansible_facts['date_time']['iso8601'] if openclaw_force_restart else 'false' }}"
              # Custom icon in OpenShift Topology view (OCP 4.20+).
              # Falls back to app.openshift.io/runtime: nodejs on older versions.
              app.openshift.io/custom-icon: "https://raw.githubusercontent.com/ryannix123/openclaw-on-openshift/main/.github/openclaw.png"
              # Link the Topology node back to the source repo
              app.openshift.io/vcs-uri: "https://github.com/ryannix123/openclaw-on-openshift"
          spec:
            replicas: "{{ openclaw_replicas }}"
            selector:
              matchLabels:
                app.kubernetes.io/name: openclaw
            strategy:
              type: Recreate
            template:
              metadata:
                labels:
                  app.kubernetes.io/name: openclaw
                  app.kubernetes.io/component: gateway
                annotations:
                  openclaw/channel-config-hash: >-
                    {{ (_channel_config_json | default('') | hash('sha256'))
                       if _any_channel_enabled else 'none' }}
              spec:
                securityContext:
                  hostUsers: false
                initContainers:
                  - name: skills-installer
                    image: "{{ _resolved_image }}"
                    imagePullPolicy: Always
                    command:
                      - /bin/sh
                      - -c
                      - |
                        SRC=/opt/openclaw/skill-sources
                        DEST=/opt/openclaw/workspace/skills
                        echo "[skills-installer] Starting."
                        set -- "${SRC}"/*
                        if [ ! -f "$1" ]; then
                          echo "[skills-installer] No skill files found. Done."
                          exit 0
                        fi
                        if ! mkdir -p "${DEST}" 2>/dev/null; then
                          echo "[skills-installer] WARNING: ${DEST} not writable — install manually via oc exec."
                          exit 0
                        fi
                        for skill_file; do
                          [ -f "${skill_file}" ] || continue
                          skill_name=$(basename "${skill_file}")
                          skill_dir="${DEST}/${skill_name}"
                          if [ ! -f "${skill_dir}/SKILL.md" ]; then
                            echo "[skills-installer] Installing: ${skill_name}"
                            mkdir -p "${skill_dir}" && \
                              cp "${skill_file}" "${skill_dir}/SKILL.md" || \
                              echo "[skills-installer] WARNING: could not install ${skill_name}"
                          else
                            echo "[skills-installer] Already present, skipping: ${skill_name}"
                          fi
                        done
                        echo "[skills-installer] Done."
                    securityContext:
                      allowPrivilegeEscalation: false
                      capabilities:
                        drop: [ALL]
                    volumeMounts:
                      - name: workspace
                        mountPath: /opt/openclaw/workspace
                      - name: custom-skills
                        mountPath: /opt/openclaw/skill-sources
                        readOnly: true
                serviceAccountName: "{{ 'openclaw-proxy' if _sso else 'default' }}"
                containers: "{{ [_gateway_container] + (_sidecar_containers if _sso else []) }}"
                volumes:
                  - name: config
                    persistentVolumeClaim:
                      claimName: openclaw-config
                  - name: workspace
                    persistentVolumeClaim:
                      claimName: openclaw-workspace
                  - name: custom-skills
                    configMap:
                      name: openclaw-custom-skills
                      optional: true
                  - name: channel-config
                    configMap:
                      name: openclaw-channel-config
                      optional: true
      when: state == 'present'

    # Defense in depth. The real guarantee is that the gateway trusts identity
    # headers only from loopback (the sidecar). This policy additionally keeps
    # other pods off the gateway port. Broader allow policies in the namespace
    # (e.g. Developer Sandbox defaults) are additive and can widen it.
    - name: Restrict gateway ingress to the oauth-proxy port
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: networking.k8s.io/v1
          kind: NetworkPolicy
          metadata:
            name: openclaw-sso-ingress
            namespace: "{{ openclaw_namespace }}"
            labels:
              app.kubernetes.io/name: openclaw
          spec:
            podSelector:
              matchLabels:
                app.kubernetes.io/name: openclaw
            policyTypes: [Ingress]
            ingress:
              - ports:
                  - port: 8080
                    protocol: TCP
      register: _netpol_result
      ignore_errors: true
      when: state == 'present' and _sso | bool

    - name: Warn if the NetworkPolicy could not be created
      ansible.builtin.debug:
        msg: >-
          ⚠️  Could not create NetworkPolicy openclaw-sso-ingress (insufficient
          permissions?). Login still works — the gateway trusts identity only
          from the in-pod proxy — but the gateway port stays reachable in-cluster.
      when: state == 'present' and _sso | bool and _netpol_result is failed

    - name: Remove Log in with OpenShift resources when using token auth
      kubernetes.core.k8s:
        state: absent
        api_version: "{{ item.api }}"
        kind: "{{ item.kind }}"
        name: "{{ item.name }}"
        namespace: "{{ openclaw_namespace }}"
      loop:
        - { api: networking.k8s.io/v1, kind: NetworkPolicy,  name: openclaw-sso-ingress }
        - { api: v1,                   kind: Secret,         name: openclaw-proxy }
        - { api: v1,                   kind: ServiceAccount, name: openclaw-proxy }
      failed_when: false
      when: state == 'present' and not (_sso | bool)

    # ── Deploy summary ─────────────────────────────────────────────────────────
    - name: Print deployment summary
      ansible.builtin.debug:
        msg:
          - "=== OpenClaw deployment complete ==="
          - "Control UI  : https://{{ _route_host }}"
          - "Provider    : {{ ai_provider }} ({{ _api_key_env_var }})"
          - "Model       : {{ _resolved_model }}"
          - "Namespace   : {{ openclaw_namespace }}"
          - ""
          - "Channels:"
          - "  Telegram  : {{ _telegram_enabled }}"
          - "  Discord   : {{ _discord_enabled }}"
          - "  Slack     : {{ _slack_enabled }}"
          - "  WhatsApp  : {{ _whatsapp_enabled }}"
          - "  Matrix    : {{ _matrix_enabled }}"
          - "  Teams     : {{ _teams_enabled }}"
          - ""
          - "{{ '⚠️  WhatsApp webhook: https://' + _route_host + '/webhook/whatsapp' if _whatsapp_enabled | bool else '' }}"
          - ""
          - "Auth        : {{ 'Log in with OpenShift (admins: ' ~ (_admin_users | join(', ')) ~ ')' if _sso | bool else 'gateway token + device pairing' }}"
          - "{{ '' if _sso | bool else 'Retrieve gateway token:' }}"
          - "{{ '' if _sso | bool else '  oc get secret openclaw-credentials -o jsonpath={.data.OPENCLAW_GATEWAY_TOKEN} | base64 -d && echo' }}"
          - ""
          - "Watch rollout:"
          - "  oc rollout status deployment/openclaw"
      when: state == 'present'

    - name: Retrieve gateway token
      ansible.builtin.shell: |
        oc get secret openclaw-credentials           -n {{ openclaw_namespace }}           -o jsonpath='{.data.OPENCLAW_GATEWAY_TOKEN}' | base64 -d
      register: _token_value
      changed_when: false
      when: (state == 'present') and not (_sso | bool)

    # On macOS, copy the gateway token straight to the clipboard with pbcopy
    # so the user can paste it into the Control UI without selecting it
    # from the terminal. failed_when: false so we never block the playbook
    # if pbcopy is somehow unavailable (rare on macOS, but be defensive).
    - name: Copy gateway token to macOS clipboard (pbcopy)
      ansible.builtin.shell:
        cmd: printf '%s' "{{ _token_value.stdout }}" | pbcopy
      register: _pbcopy_result
      changed_when: false
      failed_when: false
      when:
        - not (_sso | bool)
        - state == 'present'
        - ansible_system | default('') == 'Darwin'

    - name: Print gateway token and access URL
      ansible.builtin.debug:
        msg:
          - "======================================================"
          - "  Gateway URL   : https://{{ _route_host }}"
          - "  Gateway Token : {{ _token_value.stdout }}"
          - "  Direct URL    : https://{{ _route_host }}/?token={{ _token_value.stdout }}"
          - "======================================================"
      when: (state == 'present') and not (_sso | bool)

    - name: Confirm token copied to macOS clipboard
      ansible.builtin.debug:
        msg: "📋 Gateway token copied to clipboard — paste it into the Control UI with ⌘V"
      when:
        - not (_sso | bool)
        - state == 'present'
        - ansible_system | default('') == 'Darwin'
        - _pbcopy_result.rc | default(1) == 0

    - name: Wait for OpenClaw pod to be Ready (Log in with OpenShift)
      ansible.builtin.command:
        cmd: >
          oc rollout status deployment/openclaw
          -n {{ openclaw_namespace }}
          --timeout=300s
      changed_when: false
      failed_when: false
      when: state == 'present' and _sso | bool

    - name: Print Log in with OpenShift instructions
      ansible.builtin.debug:
        msg:
          - "======================================================"
          - "  Open        : https://{{ _route_host }}"
          - "  Sign in     : Log in with OpenShift — no token, no pairing"
          - "  Admins      : {{ _admin_users | join(', ') }}"
          - "  Who can in  : anyone passing {{ _oauth_sar }}"
          - ""
          - "  Invite a colleague:"
          - "    oc adm policy add-role-to-user view <their-openshift-username> -n {{ openclaw_namespace }}"
          - "  Remove access:"
          - "    oc adm policy remove-role-from-user view <their-openshift-username> -n {{ openclaw_namespace }}"
          - "======================================================"
      when: state == 'present' and _sso | bool

    # -------------------------------------------------------------------------
    # Device pairing — automated first-browser approval
    #
    # OpenClaw 2.0 requires an explicit approval the first time a new browser
    # connects, AND its pairing request IDs expire within seconds. A single
    # poll-then-approve races the clock and usually loses. Instead we run a
    # tight approve LOOP entirely inside the pod: for a fixed window, repeatedly
    # list pending requests and approve every UUID found. Whatever request the
    # browser generates when you click Connect gets approved within ~2 seconds,
    # comfortably before it expires — no browser→terminal copy race.
    #
    # Skip by passing -e skip_pairing=true (e.g. if the browser is already paired)
    # -------------------------------------------------------------------------
    - name: Wait for OpenClaw pod to be Ready before prompting
      ansible.builtin.command:
        cmd: >
          oc rollout status deployment/openclaw
          -n {{ openclaw_namespace }}
          --timeout=180s
      changed_when: false
      when: (state == 'present' and not (skip_pairing | default(false) | bool)) and not (_sso | bool)

    - name: Prompt user to open browser and connect
      ansible.builtin.pause:
        prompt: >
          OpenClaw is ready. Open the Control UI, paste the token if the field
          is empty, and click Connect:

          https://{{ _route_host }}/?token={{ _token_value.stdout }}

          Then press ENTER here. The playbook will auto-approve the pairing
          request for ~60 seconds — just click Connect again in the browser
          when it says the device was approved.
      when: (state == 'present' and not (skip_pairing | default(false) | bool)) and not (_sso | bool)

    # Continuous approve loop, run inside the pod. For up to ~60s it lists
    # pending requests and approves each UUID it finds. Exits early and cleanly
    # once at least one request has been approved. All logic runs in-pod so
    # there is no per-iteration `oc exec` overhead and no expiry race.
    - name: Auto-approve device pairing request (loop until approved)
      ansible.builtin.shell: |
        oc exec -n {{ openclaw_namespace }} deploy/openclaw -- sh -c '
          approved=0
          for i in $(seq 1 30); do
            ids=$(node dist/index.js devices list 2>/dev/null \
              | grep -oE "[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}")
            for id in $ids; do
              if node dist/index.js devices approve "$id" 2>/dev/null; then
                echo "APPROVED $id"
                approved=1
              fi
            done
            [ "$approved" -eq 1 ] && break
            sleep 2
          done
          [ "$approved" -eq 1 ] || echo "NO_REQUEST_APPROVED"
        '
      register: _pairing_loop
      changed_when: "'APPROVED' in _pairing_loop.stdout"
      failed_when: false
      when: (state == 'present' and not (skip_pairing | default(false) | bool)) and not (_sso | bool)

    # ── Automations ────────────────────────────────────────────────────────────
    # Jobs live in OpenClaw's state database, not openclaw.json, so they are
    # registered through the CLI against the running gateway. The spec is passed
    # as JSON on stdin and a small in-pod script does add-or-edit by name, then
    # (optionally) removes playbook-managed jobs no longer declared. Managed jobs
    # are recognisable by the "[managed]" marker in their display name.
    - name: Wait for the gateway to accept CLI connections
      ansible.builtin.shell: |
        oc exec -n {{ openclaw_namespace }} deploy/openclaw -- sh -c '
          for i in $(seq 1 30); do
            node dist/index.js automations list >/dev/null 2>&1 && exit 0
            sleep 2
          done
          echo "gateway not ready for CLI after 60s" >&2; exit 1'
      changed_when: false
      when: state == 'present' and (openclaw_automations | default({}) | length > 0)

    - name: Register automations (add or edit by name; prune undeclared managed jobs)
      ansible.builtin.shell: |
        oc exec -n {{ openclaw_namespace }} -i deploy/openclaw -- node - <<'JS'
        const { execFileSync } = require("child_process");
        const spec  = JSON.parse(require("fs").readFileSync(0, "utf8"));
        const prune = {{ openclaw_automations_prune | default(true) | bool | to_json }};
        const cli   = (...a) => execFileSync("node", ["dist/index.js", "automations", ...a], { encoding: "utf8" });
        // `automations list --json` returns { jobs: [...] } (cron-cli/list-jobs.ts).
        let existing = [];
        try { const r = JSON.parse(cli("list", "--all", "--json")); existing = Array.isArray(r) ? r : (r.jobs || []); } catch (e) { existing = []; }
        const byName = Object.fromEntries(existing.map(j => [j.name, j]));
        const MARK = "[managed]";
        for (const [name, j] of Object.entries(spec)) {
          const args = ["--name", name, "--display-name", `${name} ${MARK}`, "--cron", j.schedule];
          if (j.tz) args.push("--tz", j.tz);
          if (j.model) args.push("--model", j.model);
          if (j.timeout_seconds != null) args.push("--timeout-seconds", String(j.timeout_seconds));
          const d = j.delivery || {};
          if (d.webhook) args.push("--webhook", d.webhook);
          else if (d.channel) { args.push("--announce", "--channel", d.channel); if (d.to) args.push("--to", String(d.to)); }
          else args.push("--no-deliver");
          if (byName[name]) {
            cli("edit", byName[name].id, ...args, "--message", j.prompt);
            console.log("EDITED " + name);
          } else {
            cli("add", ...args, "--message", j.prompt);
            console.log("ADDED " + name);
          }
        }
        if (prune) for (const j of existing) {
          const label = j.displayName || j.display_name || "";
          if (label.endsWith(MARK) && !spec[j.name]) {
            cli("remove", j.id);
            console.log("REMOVED " + j.name);
          }
        }
        JS
      args:
        stdin: "{{ openclaw_automations | default({}) | to_json }}"
      register: _automations
      changed_when: "'ADDED' in _automations.stdout or 'EDITED' in _automations.stdout or 'REMOVED' in _automations.stdout"
      when: state == 'present' and (openclaw_automations | default({}) | length > 0)

    - name: Show registered automations
      ansible.builtin.debug:
        msg: "{{ _automations.stdout_lines }}"
      when: _automations is defined and _automations.stdout_lines is defined

    - name: Print pairing result
      ansible.builtin.debug:
        msg:
          - "✅ Device pairing approved — click Connect again in the browser."
          - "This browser is now paired. Future logins from it go straight through."
      when:
        - not (_sso | bool)
        - state == 'present'
        - not (skip_pairing | default(false) | bool)
        - _pairing_loop is defined
        - "'APPROVED' in (_pairing_loop.stdout | default(''))"

    - name: Print manual pairing instructions (fallback)
      ansible.builtin.debug:
        msg:
          - "======================================================"
          - "  No pairing request was approved automatically."
          - ""
          - "  This usually means Connect wasn't clicked in time, or"
          - "  the token field was empty. To pair manually:"
          - ""
          - "  1. In the browser, paste the gateway token and click Connect."
          - "  2. Immediately run this one-liner (lists + approves in-pod):"
          - ""
          - "     oc exec deploy/openclaw -- sh -c 'for id in $(node dist/index.js devices list 2>/dev/null | grep -oE \"[0-9a-f-]{36}\"); do node dist/index.js devices approve $id; done'"
          - ""
          - "  3. Click Connect again in the browser."
          - "======================================================"
      when:
        - not (_sso | bool)
        - state == 'present'
        - not (skip_pairing | default(false) | bool)
        - _pairing_loop is defined
        - "'NO_REQUEST_APPROVED' in (_pairing_loop.stdout | default(''))"

